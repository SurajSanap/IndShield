<!DOCTYPE html>
<html lang="en">

<head>
    <title>Register page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/ec53c9ed31.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/manage_cam.css">
    
    <style>
        .google-btn {
            width: 100%;
            padding: 12px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
            text-decoration: none;
        }
        
        .google-btn:hover {
            background-color: #357ae8;
            color: white;
            text-decoration: none;
        }
        
        .google-btn i {
            font-size: 20px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #333;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ccc;
        }
        
        .divider span {
            padding: 0 10px;
        }
    </style>
</head>

<body>

    <section>
        <div class="imgBx">
            <img src="/static/img/signup.jpg">
        </div>
        <div class="contentBx">
            <div class="formBx">
                <div id="msg" class="container my-4">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-primary alert-dismissible fade show" role="alert">
                        <strong>Message!</strong> {{ message | safe}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}
                </div>
                
                <h2>SignUp</h2>
                
                <!-- Google Sign-Up Button -->
                <a href="/google/login" class="google-btn">
                    <i class="fab fa-google"></i>
                    <span>Sign up with Google</span>
                </a>
                
                <div class="divider">
                    <span>OR</span>
                </div>
                
                <form action="/register" method="POST">
                    <div class="inputBx">
                        <span>Username</span>
                        <input type="text" class="form-control" id="name" placeholder="Enter Username" name="name" required>
                    </div>
                    <div class="inputBx">
                        <label for="email"><span>Email</span></label>
                        <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" required>
                    </div>
                    <div class="inputBx">
                        <label for="pwd"><span>Password</span></label>
                        <input type="password" class="form-control" id="pwd" placeholder="Enter password" name="password" required>
                    </div>
                    <div class="inputBx">
                        <input type="submit" value="Submit" name="">
                    </div>
                    <div class="inputBx">
                       <p>Already Signed in? <a href="login_page">Sign in</a></p>
                    </div>
                </form>
            </div> 
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</body>

</html>
